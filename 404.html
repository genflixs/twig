<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Page Not Found - StreamPulse HD</title>
  <meta name="description" content="The page you requested could not be found on StreamPulse." />
  <meta name="theme-color" content="#070a12" />
  <link rel="icon" type="image/svg+xml" href="/assets/images/logo.svg" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <div style="display:flex;align-items:center;gap:14px;">
        <a href="/" class="brand-logo" aria-label="StreamPulse Home">
          <img src="/assets/images/logo.svg" alt="StreamPulse Logo" width="160" height="34" />
        </a>
      </div>
      <nav class="desktop-nav">
        <a href="/" class="nav-link" data-i18n="nav_home">Home</a>
        <a href="/pop/" class="nav-link" data-i18n="nav_popular">Popular</a>
        <a href="/l/" class="nav-link" data-i18n="nav_latest">Latest</a>
        <a href="/c/" class="nav-link" data-i18n="nav_categories">Categories</a>
      </nav>
      <div class="header-actions">
        <div class="lang-selector">
          <button class="lang-btn active" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="id">ID</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main-content" style="display:flex;align-items:center;">
    <div class="container">
      <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-desc">
          The requested page or video stream does not exist, has been moved, or the link is expired.
        </p>
        <a href="/" class="featured-play-btn" style="display:inline-flex;margin:0 auto;" data-i18n="back_to_home">
          &larr; Return to Home
        </a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>&copy; 2026 StreamPulse. <span data-i18n="all_rights_reserved">All rights reserved.</span></div>
        <div><span data-i18n="developed_for">Built for GitHub Pages</span></div>
      </div>
    </div>
  </footer>

  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
