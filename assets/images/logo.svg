<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <defs>
    <linearGradient id="sp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="sp-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3366" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.9" />
    </linearGradient>
    <filter id="sp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon Emblem -->
  <g transform="translate(6, 6)">
    <!-- Outer rounded hexagon/squircle -->
    <rect x="2" y="2" width="44" height="44" rx="14" fill="#121726" stroke="url(#sp-grad)" stroke-width="2.5" />
    
    <!-- Neon waveform pulse lines in background -->
    <path d="M10 24 L16 24 L19 16 L23 32 L27 20 L30 27 L33 24 L38 24" stroke="url(#sp-pulse)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
    
    <!-- Play Triangle -->
    <path d="M20 16 L34 24 L20 32 Z" fill="url(#sp-grad)" filter="url(#sp-glow)" />
    <path d="M20 16 L34 24 L20 32 Z" fill="#FFFFFF" opacity="0.3" />
  </g>
  
  <!-- Typography -->
  <text x="64" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="24" font-weight="900" letter-spacing="-0.5" fill="#FFFFFF">
    STREAM<tspan fill="url(#sp-grad)">PULSE</tspan>
  </text>
  
  <!-- Subtitle badge -->
  <rect x="64" y="41" width="70" height="13" rx="3" fill="#1F293D" />
  <text x="68" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1" fill="#94A3B8">
    HD STREAM
  </text>
</svg>
